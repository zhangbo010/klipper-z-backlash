# Z轴回差补偿配置示例
# 将此段复制到 printer.cfg 中，或使用 include 引入
#
# 应用场景：Z 轴丝杆与螺母存在间隙，方向反转时产生空程
# 补偿方式：换向且行程足够时拆成两段真实直线运动（消隙 + 到位），
#          不修改 get_position，逻辑坐标与 G-code 一致
# 建议从 0.05 开始测试 backlash，逐步增加直到层高一致

[z_backlash]
backlash: 0.1
# 可选：两段消隙之间 dwell（秒），减轻 lookahead 把两段合成一条轨迹；0=不停顿
# split_pause: 0.08
# 可选：第一段消隙速度（mm/s）；0=与本次 G 移动同速；调低便于肉眼观察消隙段
# takeup_speed: 0
