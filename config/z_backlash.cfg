# Z 轴回差补偿配置示例
# 复制到 printer.cfg 同目录，或使用 [include z_backlash.cfg]
#
# 换向且 |ΔZ|>backlash：先走到 G-code 目标（步进 |ΔZ|），再脉冲补偿；
#   |ΔZ|≤backlash 时只走一段。归零（G28）整段过程中不补偿。
# 建议从较小 backlash 实测层高，再调 compensation_scale

[z_backlash]
backlash: 0.1
# 可选：补偿段 = backlash × compensation_scale（默认 1.0），偏多可调 0.5～0.8
# compensation_scale: 1.0
# 可选：两段之间 dwell（秒），0=不停顿
# split_pause: 0.08
# 可选：第二段补偿速度（mm/s），0=与本次 G 移动同速
# takeup_speed: 0
